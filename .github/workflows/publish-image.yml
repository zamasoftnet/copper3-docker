name: Publish container image

# Copper PDF の Docker イメージをビルドして GHCR に push する。
#
# 公開配布用イメージには固定allow-listのNoto Sans/Serif JPだけを含める。
# CIはReleaseから製品tarballとNoto専用assetを取得し、Dockerfileの
# distribution targetがベース由来フォントや他書体の混入を拒否する。
# license-key などの秘密はイメージに焼かず、実行時にマウントする。
#
# イメージタグ:
#   - <version>-<build>  例) 3.2.33-18880  同一バージョンの再ビルドを区別する固定タグ
#   - <version>          例) 3.2.33        最新ビルドを指す可変タグ
#   - latest                               可変タグ
# <build> は tarball 内 lib/cssj-copper.jar の jp/cssj/copper/VERSION（3行目）から
# 取得する。Ant の <buildnumber/> が製品ビルド時に埋め込む値そのもの。
#
# 必要な事前設定:
#   - workflow_dispatch input asset_repo またはリポジトリ変数 ASSET_REPO:
#       製品tarballとNoto専用assetを置いたReleaseのあるリポジトリ
#       例) zamasoftnet/copper3-proprietary
#   - リポジトリ Secret ASSET_TOKEN : 上記が private の場合に download するための PAT(repo スコープ)
#   - 上記リポジトリに tag `v<version>` のReleaseを作り、次のアセットを添付:
#       copper-pdf-<version>.tar.gz, noto-fonts.tar.gz
#   - 初回 publish 後、GHCR パッケージの可視性を Public に変更（ワンタイム手動）
#       Org の Packages → copper-pdf → Package settings → Change visibility → Public

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Copper PDF version (image tag)'
        required: true
        default: '3.2.33'
      asset_repo:
        description: 'Release asset repository (OWNER/REPO)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zamasoftnet/copper-pdf

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout recipe
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download product tarball and public Noto fonts from release
        env:
          GH_TOKEN: ${{ secrets.ASSET_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          ASSET_REPO: ${{ inputs.asset_repo || vars.ASSET_REPO }}
        run: |
          set -euo pipefail
          if [ -z "${ASSET_REPO:-}" ]; then
            echo "::error::workflow input asset_repo or repository variable ASSET_REPO is not set"; exit 1
          fi
          mkdir -p proprietary/CopperPDF/build
          gh release download "v${VERSION}" --repo "$ASSET_REPO" \
            --pattern "copper-pdf-${VERSION}.tar.gz" --output "proprietary/CopperPDF/build/copper-pdf-${VERSION}.tar.gz"
          gh release download "v${VERSION}" --repo "$ASSET_REPO" \
            --pattern "noto-fonts.tar.gz" --output noto-fonts.tar.gz
          mkdir -p public-fonts
          tar -xzf noto-fonts.tar.gz -C public-fonts
          rm noto-fonts.tar.gz

      - name: Resolve build number from product tarball
        id: build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          tar -xzf "proprietary/CopperPDF/build/copper-pdf-${VERSION}.tar.gz" \
            --to-stdout "copper-pdf-${VERSION}/lib/cssj-copper.jar" > /tmp/cssj-copper.jar
          BUILD=$(unzip -p /tmp/cssj-copper.jar jp/cssj/copper/VERSION | sed -n '3p' | tr -d '[:space:]')
          case "$BUILD" in
            ''|*[!0-9]*) echo "::error::could not resolve build number from product tarball (got: '${BUILD}')"; exit 1 ;;
          esac
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Build number: $BUILD"

      - name: Safety check (no secrets in build context)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          for f in conf/license-key conf/password.txt deploy.json; do
            if [ -f "$f" ]; then echo "::error::$f must not be in the image"; exit 1; fi
          done
          if find conf -type f \( -iname '*.otf' -o -iname '*.otc' -o -iname '*.ttf' -o -iname '*.ttc' \
               -o -iname '*.pfb' -o -iname '*.pfa' -o -iname '*.woff' -o -iname '*.woff2' \
               -o -iname '*.eot' -o -iname '*.dfont' -o -iname '*.fon' \) \
               -print -quit | grep -q .; then
            echo "::error::public build context contains a font binary"; exit 1
          fi
          grep -Ev '^[[:space:]]*(#|$)' distribution-noto-fonts.txt | sort -u > /tmp/expected-fonts
          find public-fonts -type f \( -iname '*.otf' -o -iname '*.otc' -o -iname '*.ttf' -o -iname '*.ttc' \
               -o -iname '*.pfb' -o -iname '*.pfa' -o -iname '*.woff' -o -iname '*.woff2' \
               -o -iname '*.eot' -o -iname '*.dfont' -o -iname '*.fon' \) \
               -printf '%f\n' | sort -u > /tmp/actual-fonts
          if ! diff -u /tmp/expected-fonts /tmp/actual-fonts; then
            echo "::error::public font asset is not the fixed Noto allow-list"; exit 1
          fi
          if tar -tzf "proprietary/CopperPDF/build/copper-pdf-${VERSION}.tar.gz" \
               | grep -Eiq '\.(otf|otc|ttf|ttc|pfb|pfa|woff|woff2|eot|dfont|fon)$'; then
            echo "::error::product tarball contains a font binary"; exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: distribution
          build-contexts: |
            copper-dist=proprietary/CopperPDF/build
            noto-sans=public-fonts/Noto_Sans_JP
            noto-serif=public-fonts/Noto_Serif_JP
          push: true
          build-args: |
            COPPER_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-${{ steps.build.outputs.build }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}-${{ steps.build.outputs.build }}
            jp.cssj.copper.build=${{ steps.build.outputs.build }}
