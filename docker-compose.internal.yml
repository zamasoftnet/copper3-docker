# 社内運用専用。約300MBのフォントパックとruntime license secretを使う。
# 公開配布にはNotoだけを含むdocker-compose.ymlを使うこと。
services:
  copper-pdf:
    image: copper-pdf-internal:${COPPER_VERSION:-3.2.34}
    build:
      context: .
      dockerfile: Dockerfile
      target: internal
      additional_contexts:
        copper-dist: ../proprietary/CopperPDF/build
        copper-fonts: ./conf/profiles/fonts
      args:
        COPPER_VERSION: ${COPPER_VERSION:-3.2.34}
    container_name: copper-pdf
    restart: unless-stopped
    ports:
      - "8497:8497"
      - "8499:8499"
    volumes:
      - copper-logs:/opt/copper-pdf/logs
    secrets:
      - source: copper-license
        target: /opt/copper-pdf/conf/license-key
    environment:
      JAVA_OPTS: "-Xmx2048m"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8497/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  copper-logs:

secrets:
  copper-license:
    file: ./conf/license-key
